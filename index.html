<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060912">
<meta name="description" content="Sayeed Pro Scientific Calculator">
<link rel="manifest" href="manifest.webmanifest">
<title>Sayeed — Pro Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#050811;--text:#f7f9ff;--muted:#7f8ba5;--panel:rgba(10,16,29,.8);--key:#111b2e;--sci:#17253d;--op:#24365a;--line:rgba(255,255,255,.09);--v:#786cff;--c:#20dcff;--pink:#ff4fa6}
html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;overflow-x:hidden;transition:background .4s,color .4s}
body.light{--bg:#edf3fb;--text:#101728;--muted:#607089;--panel:rgba(255,255,255,.8);--key:#e5ebf5;--sci:#dbe6f7;--op:#cbdaf4;--line:rgba(20,40,70,.12)}
body:before{content:"";position:fixed;inset:-20%;z-index:-5;background:radial-gradient(circle at 10% 5%,#786cff55 0 8%,transparent 27%),radial-gradient(circle at 92% 28%,#20dcff35 0 7%,transparent 27%),radial-gradient(circle at 52% 100%,#ff4fa62c 0 7%,transparent 30%);animation:aurora 15s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;z-index:-4;opacity:.13;background-image:linear-gradient(#fff2 1px,transparent 1px),linear-gradient(90deg,#fff2 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent 82%)}
@keyframes aurora{to{transform:rotate(7deg) scale(1.14);filter:hue-rotate(35deg)}}
.wrap{width:min(980px,calc(100% - 18px));margin:auto;padding:15px 0 32px}
.splash{position:fixed;inset:0;z-index:100;background:#050811;display:grid;place-items:center;transition:.55s}.splash.hide{opacity:0;visibility:hidden}.smark,.logo{display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;background:linear-gradient(135deg,var(--v),var(--c));box-shadow:0 0 60px #786cff55}.smark{width:82px;height:82px;border-radius:26px;font-size:45px;animation:enter .8s cubic-bezier(.2,1.5,.3,1)}.splash small{display:block;text-align:center;margin-top:14px;letter-spacing:3px;color:#8290aa;font-size:9px}@keyframes enter{from{opacity:0;transform:scale(.55) rotate(-12deg)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;animation:drop .6s both}.brand{display:flex;align-items:center;gap:12px}.logo{width:51px;height:51px;border-radius:17px;color:white;font-size:28px;position:relative;overflow:hidden}.logo:after{content:"";position:absolute;inset:-100%;background:linear-gradient(110deg,transparent 43%,#fff9 50%,transparent 57%);animation:shine 3s infinite}.brand h1{margin:0;font:700 21px "Space Grotesk"}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2.1px;margin-top:2px}.actions{display:flex;gap:7px}.icon{width:43px;height:43px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:inherit;backdrop-filter:blur(18px);font-size:17px;transition:.18s}.icon:active{transform:scale(.86)}@keyframes shine{to{transform:translateX(70%) rotate(25deg)}}@keyframes drop{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:none}}
.card,.history{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(25px);box-shadow:0 28px 80px #0007;border-radius:29px}.card{padding:14px;animation:card .7s .05s both}@keyframes card{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.display{min-height:220px;border-radius:23px;background:linear-gradient(145deg,#070b15,#121c32);border:1px solid #ffffff0c;padding:15px 18px;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:inset 0 1px #fff09}.display:before{content:"";position:absolute;width:330px;height:200px;right:-120px;bottom:-120px;background:var(--v);filter:blur(80px);opacity:.25;animation:glow 4s ease-in-out infinite alternate}@keyframes glow{to{transform:translate(-55px,-20px);opacity:.42}}
.displaybar{display:flex;align-items:center;gap:8px;position:relative;z-index:1}.pill{padding:7px 10px;border-radius:9px;background:#786cff20;color:#c9c5ff;font-size:10px;font-weight:800;letter-spacing:1px}.mem{font-size:10px;color:#697691}.copy{margin-left:auto;border:0;border-radius:10px;padding:8px 11px;background:#ffffff0a;color:#aab5cb;font-size:11px}.expr{margin-top:auto;text-align:right;color:#78849c;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:25px}.prev{text-align:right;color:#56627a;font-size:11px;min-height:17px}.result{position:relative;z-index:1;text-align:right;font:600 clamp(38px,7vw,62px) "Space Grotesk";letter-spacing:-2.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pop{animation:pop .35s cubic-bezier(.2,1.5,.3,1)}@keyframes pop{40%{transform:scale(1.07);text-shadow:0 0 38px #786cffaa}100%{transform:none}}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.ctrl{flex:1;min-width:57px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--sci);color:#8f9ab2;font-size:11px;font-weight:700;transition:.18s}.ctrl.active{background:linear-gradient(135deg,#766bff,#3286ec);color:white;border-color:transparent;box-shadow:0 10px 28px #526cff35}.ctrl:active{transform:scale(.91)}
.pad{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.key{height:58px;border:1px solid var(--line);border-radius:16px;background:var(--key);color:var(--text);font-weight:700;font-size:17px;position:relative;overflow:hidden;box-shadow:inset 0 1px #fff08,0 6px 16px #0002;transition:transform .12s,filter .18s,box-shadow .18s;isolation:isolate}.key:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff5;left:var(--x,50%);top:var(--y,50%);transform:translate(-50%,-50%) scale(0);pointer-events:none}.key.ripple:after{animation:ripple .52s ease-out}@keyframes ripple{to{transform:translate(-50%,-50%) scale(20);opacity:0}}.key.press{transform:scale(.88);filter:brightness(1.35);box-shadow:0 0 0 4px #786cff15,0 2px 8px #0005}.sci{background:var(--sci);color:#aab7cf;font-size:13px}.op{background:var(--op);color:#c9ccff}.fn{background:linear-gradient(145deg,#38213f,#24182f);color:#ff91c1}.eq{grid-row:span 2;background:linear-gradient(135deg,#7b6cff,#248ff0);font-size:26px;box-shadow:0 14px 32px #4f72ff40;animation:eq 3s ease-in-out infinite}.zero{grid-column:span 2}@keyframes eq{50%{box-shadow:0 0 0 5px #4f72ff08,0 14px 42px #4f72ff60}}
.hint{display:flex;gap:8px;flex-wrap:wrap;color:#66738e;font-size:10px;margin:12px 3px 0}.hint b{color:#dce1ef}
.history{padding:19px;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:end}.eyebrow{color:var(--c);font-size:9px;font-weight:800;letter-spacing:2.2px}.head h2{font:700 25px "Space Grotesk";margin:5px 0 0}.clear{border:1px solid var(--line);background:#fff07;color:#9da8bd;padding:9px 12px;border-radius:10px;font-size:11px}.list{display:grid;gap:8px;margin-top:15px}.item{padding:13px;border:1px solid var(--line);border-radius:13px;background:#ffffff03;cursor:pointer;animation:item .4s both;position:relative}.item:active{transform:scale(.985)}.ie{font-size:11px;color:#78849d;padding-right:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ir{font-weight:800;margin-top:4px}.del{position:absolute;right:9px;top:9px;width:25px;height:25px;border:0;border-radius:8px;background:#ff4fa611;color:#ff8fbe}.empty{text-align:center;padding:28px;color:#69758d;font-size:12px}@keyframes item{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{text-align:center;color:#66728b;font-size:10px;margin-top:16px}.toast{position:fixed;z-index:30;left:50%;bottom:25px;transform:translate(-50%,30px);opacity:0;background:#111a2d;color:#fff;border:1px solid #fff12;border-radius:13px;padding:11px 15px;font-size:12px;box-shadow:0 18px 40px #0008;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.wrap{width:min(100% - 12px,540px);padding:9px 0 25px}.card{padding:10px}.display{min-height:190px}.pad{grid-template-columns:repeat(4,1fr);gap:7px}.key{height:56px}.eq{grid-column:4;grid-row:span 2}.zero{grid-column:span 2}.history{padding:17px}.head h2{font-size:22px}}
@media(max-width:380px){.key{height:51px}.result{font-size:35px}}
</style>
</head>
<body>
<div class="splash" id="splash"><div><div class="smark">S</div><small>SAYEED PRO</small></div></div>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">S</div><div><h1>Sayeed</h1><small>ULTRA PREMIUM CALCULATOR</small></div></div><div class="actions"><button class="icon" id="sound" aria-label="Sound">🔊</button><button class="icon" id="theme" aria-label="Theme">☼</button><button class="icon" id="hist" aria-label="History">◷</button></div></header>
<section class="card">
<div class="display"><div class="displaybar"><span class="pill" id="mode">DEG</span><span class="mem" id="memory">M: 0</span><button class="copy" id="copy">Copy</button></div><div class="expr" id="expr">0</div><div class="prev" id="prev">Ready</div><div class="result" id="result">0</div></div>
<div class="controls"><button class="ctrl active" id="deg">DEG</button><button class="ctrl" id="rad">RAD</button><button class="ctrl" id="second">2nd</button><button class="ctrl" id="mc">MC</button><button class="ctrl" id="mr">MR</button><button class="ctrl" id="mp">M+</button><button class="ctrl" id="mm">M−</button></div>
<div class="pad" id="pad">
<button class="key fn" data-a="clear">AC</button><button class="key fn" data-a="back">⌫</button><button class="key fn" data-v="%">%</button><button class="key op" data-v="÷">÷</button>
<button class="key sci" data-n="sin">sin</button><button class="key sci" data-n="cos">cos</button><button class="key sci" data-n="tan">tan</button><button class="key sci" data-v="log(">log</button>
<button class="key sci" data-v="ln(">ln</button><button class="key sci" data-v="sqrt(">√</button><button class="key sci" data-v="π">π</button><button class="key sci" data-v="e">e</button>
<button class="key sci" data-v="^2">x²</button><button class="key sci" data-v="^3">x³</button><button class="key sci" data-v="!">x!</button><button class="key op" data-v="×">×</button>
<button class="key sci" data-v="(">(</button><button class="key sci" data-v=")">)</button><button class="key sci" data-v="abs(">abs</button><button class="key sci" data-v="inv(">1/x</button>
<button class="key num" data-v="7">7</button><button class="key num" data-v="8">8</button><button class="key num" data-v="9">9</button><button class="key op" data-v="−">−</button>
<button class="key num" data-v="4">4</button><button class="key num" data-v="5">5</button><button class="key num" data-v="6">6</button><button class="key op" data-v="+">+</button>
<button class="key num" data-v="1">1</button><button class="key num" data-v="2">2</button><button class="key num" data-v="3">3</button><button class="key eq" data-a="eq">=</button>
<button class="key num zero" data-v="0">0</button><button class="key num" data-v=".">.</button>
</div>
<div class="hint"><b>⌨ Keyboard</b><span>0–9</span><span>+ − × ÷</span><span>Enter</span><span>Backspace</span><span>Esc</span></div>
</section>
<section class="history" id="history"><div class="head"><div><div class="eyebrow">YOUR SPACE</div><h2>Calculation History</h2></div><button class="clear" id="clear">Clear all</button></div><div class="list" id="list"></div></section>
<footer>© <span id="year"></span> Sayeed Calculator • Fast • Private • Offline-ready</footer>
</div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),Q=s=>document.querySelectorAll(s);
let ex="",mem=+(localStorage.sayeedMem||0),angle=localStorage.sayeedAngle||"DEG",second=false,sound=localStorage.sayeedSound!=="off",history=JSON.parse(localStorage.sayeedHistory||"[]");
function beep(f=440,d=.06){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext,A=new C,o=A.createOscillator(),g=A.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,A.currentTime);g.gain.exponentialRampToValueAtTime(.025,A.currentTime+.005);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d+.01)}catch(e){}}
function buzz(n=7){try{navigator.vibrate?.(n)}catch(e){}}
function toast(t){const x=$("#toast");x.textContent=t;x.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.classList.remove("show"),1300)}
function factorial(n){if(!Number.isInteger(n)||n<0||n>170)throw Error("Invalid factorial");let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function trig(n,x){x=angle==="DEG"?x*Math.PI/180:x;if(second){const r=n==="sin"?Math.asin(x):n==="cos"?Math.acos(x):Math.atan(x);return angle==="DEG"?r*180/Math.PI:r}return n==="sin"?Math.sin(x):n==="cos"?Math.cos(x):Math.tan(x)}
function evaluate(s){let t=s.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-").replaceAll("π","Math.PI").replace(/\be\b/g,"Math.E").replace(/(\d+(?:\.\d+)?)!/g,"factorial($1)").replace(/\^2/g,"**2").replace(/\^3/g,"**3").replace(/sqrt\(/g,"Math.sqrt(").replace(/log\(/g,"Math.log10(").replace(/ln\(/g,"Math.log(").replace(/abs\(/g,"Math.abs(").replace(/inv\(/g,"(1/").replace(/sin\(/g,"trig('sin',").replace(/cos\(/g,"trig('cos',").replace(/tan\(/g,"trig('tan',").replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");if(!/^[0-9A-Za-z_+*/().,\s'"*-]+$/.test(t))throw Error("Invalid input");return Function("trig","factorial","return ("+t+")")(trig,factorial)}
function format(n){if(!Number.isFinite(n))throw Error("Math error");return Number(n.toPrecision(12)).toString()}
function update(){const r=$("#result");$("#expr").textContent=ex||"0";$("#memory").textContent="M: "+format(mem);$("#mode").textContent=angle;try{r.textContent=format(evaluate(ex));$("#prev").textContent=ex?"Preview":"Ready"}catch(e){r.textContent=ex?"…":"0";$("#prev").textContent=ex?"":"Ready"}}
function add(v){ex+=v;update();beep(v==="+"||v==="−"||v==="×"||v==="÷"?520:430);buzz(6)}
function calculate(){if(!ex)return;try{const r=format(evaluate(ex));history.unshift({e:ex,r});history=history.slice(0,60);localStorage.sayeedHistory=JSON.stringify(history);ex=r;$("#prev").textContent="Calculated";$("#result").textContent=r;$("#result").classList.remove("pop");void $("#result").offsetWidth;$("#result").classList.add("pop");render();beep(820,.11);buzz(15)}catch(e){$("#result").textContent="Error";$("#prev").textContent=e.message;beep(150,.12);buzz(30);setTimeout(update,900)}}
function render(){const list=$("#list");list.innerHTML=history.length?history.map((h,i)=>`<div class="item" data-i="${i}" style="animation-delay:${Math.min(i*30,300)}ms"><button class="del" data-del="${i}" aria-label="Delete">×</button><div class="ie">${h.e}</div><div class="ir">= ${h.r}</div></div>`).join(""):'<div class="empty">No calculations yet.<br><br>Your recent results will appear here.</div>'}
function setAngle(a){angle=a;localStorage.sayeedAngle=a;$("#deg").classList.toggle("active",a==="DEG");$("#rad").classList.toggle("active",a==="RAD");update()}
function press(b,x,y){const r=b.getBoundingClientRect();b.style.setProperty("--x",(x-r.left)+"px");b.style.setProperty("--y",(y-r.top)+"px");b.classList.remove("press","ripple");void b.offsetWidth;b.classList.add("press","ripple");setTimeout(()=>b.classList.remove("press"),140)}
$("#pad").addEventListener("pointerdown",e=>{const b=e.target.closest(".key");if(b)press(b,e.clientX,e.clientY)});
$("#pad").addEventListener("click",e=>{const b=e.target.closest(".key");if(!b)return;const a=b.dataset.a;if(a==="clear"){ex="";update();beep(240);buzz(10)}else if(a==="back"){ex=ex.slice(0,-1);update();beep(320)}else if(a==="eq")calculate();else if(b.dataset.n)add(b.dataset.n+"(");else add(b.dataset.v)});
$("#deg").onclick=()=>{setAngle("DEG");beep(500)};$("#rad").onclick=()=>{setAngle("RAD");beep(500)};
$("#second").onclick=()=>{second=!second;$("#second").classList.toggle("active",second);["sin","cos","tan"].forEach((n,i)=>{const b=$(`[data-n="${n}"]`);b.textContent=second?["sin⁻¹","cos⁻¹","tan⁻¹"][i]:n});toast(second?"Inverse functions ON":"Inverse functions OFF");beep(600);buzz(10)};
$("#mc").onclick=()=>{mem=0;localStorage.sayeedMem=0;update();toast("Memory cleared");beep(280)};
$("#mr").onclick=()=>{add(format(mem));beep(620)};$("#mp").onclick=()=>{try{mem+=evaluate(ex);localStorage.sayeedMem=mem;update();toast("M+ saved");beep(620)}catch(e){toast("Invalid value");beep(180)}};$("#mm").onclick=()=>{try{mem-=evaluate(ex);localStorage.sayeedMem=mem;update();toast("M− saved");beep(620)}catch(e){toast("Invalid value");beep(180)}};
$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#result").textContent);toast("Result copied");beep(680);buzz(10)}catch(e){toast("Copy unavailable")}};
$("#clear").onclick=()=>{history=[];localStorage.removeItem("sayeedHistory");render();toast("History cleared");beep(240)};
$("#list").onclick=e=>{const d=e.target.closest("[data-del]");if(d){e.stopPropagation();history.splice(+d.dataset.del,1);localStorage.sayeedHistory=JSON.stringify(history);render();toast("Calculation deleted");beep(280);return}const item=e.target.closest(".item");if(item){ex=history[+item.dataset.i].e;update();toast("Expression restored");beep(520)}};
$("#hist").onclick=()=>$("#history").scrollIntoView({behavior:"smooth"});$("#sound").onclick=()=>{sound=!sound;localStorage.sayeedSound=sound?"on":"off";$("#sound").textContent=sound?"🔊":"🔇";if(sound)beep(680)};$("#theme").onclick=()=>{document.body.classList.toggle("light");localStorage.sayeedTheme=document.body.classList.contains("light")?"light":"dark";toast(document.body.classList.contains("light")?"Light theme":"Dark theme");beep(520)};
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;if(/[0-9.]/.test(k))add(k);else if(k==="+"||k==="-")add(k==="-"?"−":"+");else if(k==="*"){e.preventDefault();add("×")}else if(k==="/"){e.preventDefault();add("÷")}else if(k==="Enter"||k==="="){e.preventDefault();calculate()}else if(k==="Backspace"){e.preventDefault();ex=ex.slice(0,-1);update();beep(320)}else if(k==="Escape"){ex="";update();beep(240)}});
if(localStorage.sayeedTheme==="light")document.body.classList.add("light");$("#sound").textContent=sound?"🔊":"🔇";$("#year").textContent=new Date().getFullYear();setAngle(angle);render();update();
window.addEventListener("load",()=>setTimeout(()=>$("#splash").classList.add("hide"),650));
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body></html>
