<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050812">
  <meta name="description" content="Sayeed — premium scientific calculator. Fast, private and offline-ready.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <title>Sayeed — Premium Calculator</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-logo">S</div>
      <div class="splash-name">Sayeed</div>
      <div class="splash-sub">PRECISION ENGINE</div>
      <div class="loader"><i></i></div>
    </div>
  </div>

  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">S</div>
        <div>
          <h1>Sayeed</h1>
          <p>PRO SCIENTIFIC CALCULATOR</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Toggle sound">🔊</button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">☼</button>
        <button class="icon-btn" id="historyBtn" type="button" aria-label="Show history">◷</button>
      </div>
    </header>

    <section class="calculator card">
      <div class="display">
        <div class="display-top">
          <div class="display-status">
            <button class="mode-chip active" id="degBtn" type="button">DEG</button>
            <button class="mode-chip" id="radBtn" type="button">RAD</button>
            <span class="memory-text" id="memoryText">M: 0</span>
          </div>
          <button class="copy-btn" id="copyBtn" type="button">Copy</button>
        </div>
        <div class="display-content">
          <div class="expression" id="expression">0</div>
          <div class="display-state" id="displayState">Ready</div>
          <div class="result" id="result" aria-live="polite">0</div>
        </div>
      </div>

      <div class="control-row">
        <button class="control active" id="secondBtn" type="button">2nd</button>
        <button class="control" id="mcBtn" type="button">MC</button>
        <button class="control" id="mrBtn" type="button">MR</button>
        <button class="control" id="mPlusBtn" type="button">M+</button>
        <button class="control" id="mMinusBtn" type="button">M−</button>
      </div>

      <div class="keypad" id="keypad">
        <button class="key danger" data-action="clear">AC</button>
        <button class="key danger" data-action="backspace">⌫</button>
        <button class="key danger" data-value="%">%</button>
        <button class="key operator" data-value="÷">÷</button>

        <button class="key scientific" data-fn="sin">sin</button>
        <button class="key scientific" data-fn="cos">cos</button>
        <button class="key scientific" data-fn="tan">tan</button>
        <button class="key scientific" data-fn="log">log</button>

        <button class="key scientific" data-fn="ln">ln</button>
        <button class="key scientific" data-fn="sqrt">√</button>
        <button class="key scientific" data-value="π">π</button>
        <button class="key scientific" data-value="e">e</button>

        <button class="key scientific" data-action="square">x²</button>
        <button class="key scientific" data-action="cube">x³</button>
        <button class="key scientific" data-action="factorial">x!</button>
        <button class="key operator" data-value="×">×</button>

        <button class="key scientific" data-value="(">(</button>
        <button class="key scientific" data-value=")">)</button>
        <button class="key scientific" data-fn="abs">abs</button>
        <button class="key scientific" data-fn="inv">1/x</button>

        <button class="key number" data-value="7">7</button>
        <button class="key number" data-value="8">8</button>
        <button class="key number" data-value="9">9</button>
        <button class="key operator" data-value="−">−</button>

        <button class="key number" data-value="4">4</button>
        <button class="key number" data-value="5">5</button>
        <button class="key number" data-value="6">6</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key number" data-value="1">1</button>
        <button class="key number" data-value="2">2</button>
        <button class="key number" data-value="3">3</button>
        <button class="key equals" data-action="equals">=</button>

        <button class="key number zero" data-value="0">0</button>
        <button class="key number" data-value=".">.</button>
      </div>

      <div class="keyboard-hint">
        <strong>⌨ Keyboard</strong>
        <span>0–9</span><span>+ − × ÷</span><span>Enter</span><span>Backspace</span><span>Esc</span>
      </div>
    </section>

    <section class="history card" id="historySection">
      <div class="section-head">
        <div>
          <div class="eyebrow">YOUR SPACE</div>
          <h2>Calculation History</h2>
        </div>
        <button class="clear-btn" id="clearHistoryBtn" type="button">Clear all</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>

    <footer>© <span id="year"></span> Sayeed Calculator • Fast • Private • Offline-ready</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
