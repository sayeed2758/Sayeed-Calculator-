<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#786cff">
<meta name="description" content="Sayeed Calculator — premium scientific calculator">
<title>Sayeed Calculator</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg.png" type="image/png">
<link rel="apple-touch-icon" href="./icon.svg.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="splash" id="splash"><div class="splash-inner"><div class="splash-logo">S</div><div class="splash-name">Sayeed</div><div class="splash-sub">CALCULATOR</div><div class="loader"><i></i></div></div></div>
<main class="app-shell">
<header class="topbar">
<div class="brand"><div class="brand-logo">S</div><div><h1>Sayeed</h1><p>PRECISION CALCULATOR</p></div></div>
<nav class="top-actions">
<button class="icon-btn" id="soundBtn" type="button" aria-label="Toggle sound">🔊</button>
<button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">☼</button>
<button class="icon-btn" id="historyBtn" type="button" aria-label="Open history">⌁</button>
</nav>
</header>

<section class="calculator card">
<div class="display" aria-live="polite">
<div class="display-top">
<div class="display-status"><button class="mode-chip active" id="degBtn" type="button">DEG</button><button class="mode-chip" id="radBtn" type="button">RAD</button><span class="memory-text" id="memoryText">M: 0</span></div>
<button class="copy-btn" id="copyBtn" type="button">Copy</button>
</div>
<div class="display-content"><div class="expression" id="expression">0</div><div class="display-state" id="displayState">Ready</div><div class="result" id="result">0</div></div>
</div>

<div class="control-row">
<button class="control" id="mcBtn" type="button">MC</button><button class="control" id="mrBtn" type="button">MR</button><button class="control" id="mPlusBtn" type="button">M+</button><button class="control" id="mMinusBtn" type="button">M−</button><button class="control" id="secondBtn" type="button" aria-pressed="false">2nd</button>
</div>

<div class="keypad" id="keypad">
<button class="key scientific" data-fn="sin" type="button">sin</button><button class="key scientific" data-fn="cos" type="button">cos</button><button class="key scientific" data-fn="tan" type="button">tan</button><button class="key scientific" data-fn="sqrt" type="button">√</button>
<button class="key scientific" data-fn="log" type="button">log</button><button class="key scientific" data-fn="ln" type="button">ln</button><button class="key scientific" data-fn="abs" type="button">abs</button><button class="key scientific" data-fn="inv" type="button">1/x</button>
<button class="key scientific" data-action="square" type="button">x²</button><button class="key scientific" data-action="cube" type="button">x³</button><button class="key scientific" data-value="^" type="button">xʸ</button><button class="key scientific" data-action="factorial" type="button">x!</button>
<button class="key danger" data-action="clear" type="button">AC</button><button class="key scientific" data-action="backspace" type="button">⌫</button><button class="key operator" data-value="%" type="button">%</button><button class="key operator" data-value="÷" type="button">÷</button>
<button class="key number" data-value="7" type="button">7</button><button class="key number" data-value="8" type="button">8</button><button class="key number" data-value="9" type="button">9</button><button class="key operator" data-value="×" type="button">×</button>
<button class="key number" data-value="4" type="button">4</button><button class="key number" data-value="5" type="button">5</button><button class="key number" data-value="6" type="button">6</button><button class="key operator" data-value="−" type="button">−</button>
<button class="key number" data-value="1" type="button">1</button><button class="key number" data-value="2" type="button">2</button><button class="key number" data-value="3" type="button">3</button><button class="key operator" data-value="+" type="button">+</button>
<button class="key scientific" data-value="(" type="button">(</button><button class="key scientific" data-value=")" type="button">)</button><button class="key number zero" data-value="0" type="button">0</button><button class="key number" data-value="." type="button">.</button>
<button class="key scientific" data-value="π" type="button">π</button><button class="key scientific" data-value="E" type="button">e</button><button class="key equals" data-action="equals" type="button">=</button>
</div>
<div class="keyboard-hint"><strong>Keyboard</strong><span>0–9</span><span>+ − × ÷</span><span>Enter =</span><span>Backspace</span><span>Esc</span></div>
</section>

<section class="history card" id="historySection">
<div class="section-head"><div><div class="eyebrow">YOUR CALCULATIONS</div><h2>History</h2></div>
<div class="history-actions"><button class="clear-btn" id="exportHistoryBtn" type="button">Export</button><button class="clear-btn danger-text" id="clearHistoryBtn" type="button">Clear</button></div></div>
<div class="history-tools"><input id="historySearch" type="search" placeholder="Search calculations..." autocomplete="off"><span id="historyCount">0 calculations</span></div>
<div class="history-list" id="historyList"><div class="empty">No calculations yet.</div></div>
</section>
<footer>Sayeed Calculator • <span id="year"></span></footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="./app.js" defer></script>
</body>
</html>
