<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#786cff">
  <meta name="description" content="Sayeed Calculator — fast premium scientific calculator.">
  <meta name="application-name" content="Sayeed Calculator">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sayeed">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Sayeed Calculator</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.svg.png.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- Lightweight startup screen -->
  <div class="splash" id="splash" aria-label="Loading Sayeed Calculator">
    <div class="splash-inner">
      <div class="splash-logo" aria-hidden="true">S</div>
      <div class="splash-name">Sayeed</div>
      <div class="splash-sub">CALCULATOR</div>
      <div class="loader" aria-hidden="true"><i></i></div>
    </div>
  </div>

  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <main class="app-shell">
    <!-- Header -->
<header class="topbar">

  <div class="brand">
    <img
      src="icon.svg.png.png"
      alt="Sayeed"
      class="profile-logo"
    >

    <div class="brand-text">
      <h1>Sayeed</h1>
      <p>PRECISION CALCULATOR</p>
    </div>
  </div>

  <nav class="top-actions" aria-label="Calculator options">
    <button class="icon-btn" id="soundBtn" type="button"
      aria-label="Toggle sound" title="Toggle sound">🔊</button>

    <button class="icon-btn" id="themeBtn" type="button"
      aria-label="Toggle theme" title="Toggle theme">☼</button>

    <button class="icon-btn" id="historyBtn" type="button"
      aria-label="Open calculation history" title="History">⌁</button>
  </nav>

</header>

    <!-- Calculator -->
    <section class="calculator card" aria-label="Sayeed scientific calculator">

      <!-- Display -->
      <div class="display" aria-live="polite">
        <div class="display-top">
          <div class="display-status">
            <button class="mode-chip active" id="degBtn" type="button">DEG</button>
            <button class="mode-chip" id="radBtn" type="button">RAD</button>
            <span class="memory-text" id="memoryText">M: 0</span>
          </div>

          <button class="copy-btn" id="copyBtn" type="button" aria-label="Copy result">
            Copy
          </button>
        </div>

        <div class="display-content">
          <div class="expression" id="expression">0</div>
          <div class="display-state" id="displayState">Ready</div>
          <div class="result" id="result">0</div>
        </div>
      </div>

      <!-- Memory / mode -->
      <div class="control-row" aria-label="Memory controls">
        <button class="control" id="mcBtn" type="button">MC</button>
        <button class="control" id="mrBtn" type="button">MR</button>
        <button class="control" id="mPlusBtn" type="button">M+</button>
        <button class="control" id="mMinusBtn" type="button">M−</button>
        <button class="control" id="secondBtn" type="button" aria-pressed="false">2nd</button>
      </div>

      <!-- Scientific keypad -->
      <div class="keypad" id="keypad" aria-label="Calculator keypad">

        <button class="key scientific" type="button" data-fn="sin">sin</button>
        <button class="key scientific" type="button" data-fn="cos">cos</button>
        <button class="key scientific" type="button" data-fn="tan">tan</button>
        <button class="key scientific" type="button" data-fn="sqrt" aria-label="Square root">√</button>

        <button class="key scientific" type="button" data-fn="log">log</button>
        <button class="key scientific" type="button" data-fn="ln">ln</button>
        <button class="key scientific" type="button" data-fn="abs">abs</button>
        <button class="key scientific" type="button" data-fn="inv">1/x</button>

        <button class="key scientific" type="button" data-action="square">x²</button>
        <button class="key scientific" type="button" data-action="cube">x³</button>
        <button class="key scientific" type="button" data-value="^">xʸ</button>
        <button class="key scientific" type="button" data-action="factorial">x!</button>

        <button class="key danger" type="button" data-action="clear">AC</button>
        <button class="key scientific" type="button" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="key operator" type="button" data-value="%">%</button>
        <button class="key operator" type="button" data-value="÷">÷</button>

        <button class="key number" type="button" data-value="7">7</button>
        <button class="key number" type="button" data-value="8">8</button>
        <button class="key number" type="button" data-value="9">9</button>
        <button class="key operator" type="button" data-value="×">×</button>

        <button class="key number" type="button" data-value="4">4</button>
        <button class="key number" type="button" data-value="5">5</button>
        <button class="key number" type="button" data-value="6">6</button>
        <button class="key operator" type="button" data-value="−">−</button>

        <button class="key number" type="button" data-value="1">1</button>
        <button class="key number" type="button" data-value="2">2</button>
        <button class="key number" type="button" data-value="3">3</button>
        <button class="key operator" type="button" data-value="+">+</button>

        <button class="key scientific" type="button" data-value="(">(</button>
        <button class="key scientific" type="button" data-value=")">)</button>
        <button class="key number zero" type="button" data-value="0">0</button>
        <button class="key number" type="button" data-value=".">.</button>

        <button class="key scientific" type="button" data-value="π">π</button>
        <button class="key scientific" type="button" data-value="E">e</button>
        <button class="key equals" type="button" data-action="equals" aria-label="Calculate result">=</button>
      </div>

      <div class="keyboard-hint" aria-label="Keyboard shortcuts">
        <strong>Keyboard</strong>
        <span>0–9</span>
        <span>+ − × ÷</span>
        <span>Enter =</span>
        <span>Backspace</span>
        <span>Esc</span>
      </div>
    </section>

    <!-- History -->
    <section class="history card" id="historySection" aria-label="Calculation history">
      <div class="section-head">
        <div>
          <div class="eyebrow">YOUR CALCULATIONS</div>
          <h2>History</h2>
        </div>

        <div class="history-actions">
          <button class="clear-btn" id="exportHistory" type="button">Export</button>
          <button class="clear-btn" id="clearHistoryBtn" type="button">
            Clear
          </button>
        </div>
      </div>

      <div class="history-tools">
        <input
          id="historySearch"
          type="search"
          autocomplete="off"
          placeholder="Search calculations..."
          aria-label="Search calculations"
        >
        <span id="historyCount">0 calculations</span>
      </div>

      <div class="history-list" id="historyList">
        <div class="empty">
          No calculations yet.<br><br>
          Your recent results will appear here.
        </div>
      </div>
    </section>

    <footer>
      Sayeed Calculator • <span id="year"></span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./app.js?v=10" defer></script>
<script src="./advanced-features.js" defer></script>
<script src="./sayeed-pro-upgrade-v2.js" defer></script>
<script src="./sayeed-pro-suite-v3.js" defer></script>
<script src="./sayeed-pro-suite-v4.js" defer></script>
</body>
</html>
