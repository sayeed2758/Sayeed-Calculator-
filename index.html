<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#5b4ff4">
  <meta name="description" content="A clean professional standard calculator.">
  <meta name="application-name" content="Calculator">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Standard Calculator</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar" aria-label="Calculator header">
      <div class="app-title">Standard Calculator</div>
      <div class="top-actions">
        <button class="icon-btn" id="historyBtn" type="button" aria-label="Open history" title="History">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.35-5.65"/><path d="M4 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.7 3.7.6 1.3a7.8 7.8 0 0 1 3.4 0l.6-1.3 2.3.95-.55 1.35a8 8 0 0 1 2.4 2.4l1.35-.55.95 2.3-1.3.6a7.8 7.8 0 0 1 0 3.4l1.3.6-.95 2.3-1.35-.55a8 8 0 0 1-2.4 2.4l.55 1.35-2.3.95-.6-1.3a7.8 7.8 0 0 1-3.4 0l-.6 1.3-2.3-.95.55-1.35a8 8 0 0 1-2.4-2.4l-1.35.55-.95-2.3 1.3-.6a7.8 7.8 0 0 1 0-3.4l-1.3-.6.95-2.3 1.35.55a8 8 0 0 1 2.4-2.4L7.4 4.65z"/><circle cx="12" cy="12" r="2.7"/></svg>
        </button>
      </div>
    </header>

    <section class="display-card" aria-live="polite">
      <div class="display-toolbar">
        <span class="display-mode">STANDARD</span>
        <div class="display-tools" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="display-values">
        <div class="expression" id="expression">0</div>
        <div class="result" id="result">0</div>
      </div>
      <div class="watermark">Made With ❤️ By Shahid Sir</div>
    </section>

    <section class="memory-row" aria-label="Memory controls">
      <button class="memory-key" data-memory="clear" type="button">MC</button>
      <button class="memory-key" data-memory="recall" type="button">MR</button>
      <button class="memory-key" data-memory="add" type="button">M+</button>
      <button class="memory-key" data-memory="subtract" type="button">M−</button>
      <button class="memory-key" data-memory="store" type="button">MS</button>
    </section>

    <section class="keypad" id="keypad" aria-label="Calculator keypad">
      <button class="key clear-key" data-action="clear">AC</button>
      <button class="key utility icon-key" data-action="backspace" aria-label="Backspace">
        <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M12 3H28V21H12L2.5 12z"/><path d="m17 8 6 8m0-8-6 8"/></svg>
      </button>
      <button class="key utility" data-value="%">%</button>
      <button class="key operator" data-value="÷">÷</button>

      <button class="key number" data-value="7">7</button>
      <button class="key number" data-value="8">8</button>
      <button class="key number" data-value="9">9</button>
      <button class="key operator" data-value="×">×</button>

      <button class="key number" data-value="4">4</button>
      <button class="key number" data-value="5">5</button>
      <button class="key number" data-value="6">6</button>
      <button class="key operator" data-value="−">−</button>

      <button class="key number" data-value="1">1</button>
      <button class="key number" data-value="2">2</button>
      <button class="key number" data-value="3">3</button>
      <button class="key operator" data-value="+">+</button>

      <button class="key utility" data-action="toggle-sign">±</button>
      <button class="key number" data-value="00">00</button>
      <button class="key number" data-value="0">0</button>
      <button class="key equals" data-action="equals" aria-label="Equals">=</button>
    </section>
  </main>

  <section class="overlay hidden" id="historyPanel" aria-hidden="true">
    <div class="sheet">
      <header class="sheet-header">
        <button class="back-btn" data-close="history" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
        <h1>History</h1>
        <button class="clear-history" id="clearHistory" type="button">Clear</button>
      </header>
      <div class="history-list" id="historyList"></div>
      <div class="history-empty" id="historyEmpty">Your calculations will appear here.</div>
    </div>
  </section>

  <section class="overlay hidden" id="settingsPanel" aria-hidden="true">
    <div class="sheet">
      <header class="sheet-header">
        <button class="back-btn" data-close="settings" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
        <h1>Settings</h1>
        <span aria-hidden="true"></span>
      </header>
      <div class="settings-card">
        <div class="setting-row">
          <div><div class="setting-title">Button sounds</div><div class="setting-subtitle">Play a soft tap sound</div></div>
          <button class="switch" id="soundToggle" type="button" aria-pressed="false"><span></span></button>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
