<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A simple, smooth calculator.">
  <meta name="application-name" content="Calculator">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Calculator</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="historyBtn" type="button" aria-label="History" title="History">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4.5h4.5"/><path d="M12 7v5l3.2 1.8"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.9 3 .4 1.7a8 8 0 0 1 3.4 0L14.1 3l2.1.9-.4 1.7c1 .6 1.8 1.4 2.4 2.4l1.7-.4.9 2.1-1.7.8a8 8 0 0 1 0 3.5l1.7.8-.9 2.1-1.7-.4a8 8 0 0 1-2.4 2.4l.4 1.7-2.1.9-.8-1.7a8 8 0 0 1-3.5 0L9.1 22 7 21.1l.4-1.7a8 8 0 0 1-2.4-2.4l-1.7.4-.9-2.1 1.7-.8a8 8 0 0 1 0-3.5l-1.7-.8.9-2.1 1.7.4a8 8 0 0 1 2.4-2.4L7 3.9 9.9 3Z"/><circle cx="12" cy="11.9" r="2.8"/></svg>
      </button>
    </header>

    <section class="display" aria-live="polite">
      <div class="display-content">
        <div class="expression" id="expression">0</div>
        <div class="result" id="result">0</div>
      </div>
      <div class="watermark">Made With ❤️ By Shahid Sir</div>
    </section>

    <section class="keypad" id="keypad" aria-label="Calculator keypad">
      <button class="key utility" data-action="clear">AC</button>
      <button class="key utility icon-key" data-action="backspace" aria-label="Backspace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5H9L3.5 12 9 19h11V5Zm-8.7 4 4 4m0-4-4 4"/></svg>
      </button>
      <button class="key utility" data-value="%">%</button>
      <button class="key operator" data-value="÷">÷</button>

      <button class="key number" data-value="7">7</button>
      <button class="key number" data-value="8">8</button>
      <button class="key number" data-value="9">9</button>
      <button class="key operator" data-value="×">×</button>

      <button class="key number" data-value="4">4</button>
      <button class="key number" data-value="5">5</button>
      <button class="key number" data-value="6">6</button>
      <button class="key operator" data-value="−">−</button>

      <button class="key number" data-value="1">1</button>
      <button class="key number" data-value="2">2</button>
      <button class="key number" data-value="3">3</button>
      <button class="key operator" data-value="+">+</button>

      <button class="key utility" data-action="toggle-sign">±</button>
      <button class="key number double-zero" data-value="00">00</button>
      <button class="key number" data-value="0">0</button>
      <button class="key number" data-value=".">.</button>

      <button class="key equals" data-action="equals" aria-label="Equals">=</button>
    </section>
  </main>

  <section class="overlay hidden" id="historyPanel" aria-hidden="true">
    <div class="sheet">
      <header class="sheet-header">
        <button class="back-btn" data-close="history" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg>
        </button>
        <h1>History</h1>
        <button class="clear-history" id="clearHistory" type="button">Clear</button>
      </header>
      <div class="history-list" id="historyList"></div>
      <div class="history-empty" id="historyEmpty">Your calculations will appear here.</div>
    </div>
  </section>

  <section class="overlay hidden" id="settingsPanel" aria-hidden="true">
    <div class="sheet settings-sheet">
      <header class="sheet-header">
        <button class="back-btn" data-close="settings" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg>
        </button>
        <h1>Settings</h1>
      </header>
      <div class="settings-card">
        <div class="setting-row">
          <div class="setting-title">Button sounds</div>
          <button class="switch" id="soundToggle" type="button" aria-pressed="false"><span></span></button>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
