<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050811">
<meta name="description" content="Sayeed Professional Scientific Calculator">
<link rel="manifest" href="manifest.webmanifest">
<title>Sayeed — Professional Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#050811;color:#f8faff;font-family:"DM Sans",sans-serif;overflow-x:hidden}
:root{--v:#796cff;--c:#19ddff;--p:#ff4fa8;--panel:rgba(11,17,30,.76);--line:rgba(255,255,255,.09);--num:#121c30;--sci:#18263e;--op:#223252;--muted:#8390aa}
body:before{content:"";position:fixed;inset:-25%;z-index:-5;background:radial-gradient(circle at 12% 10%,#796cff40,transparent 28%),radial-gradient(circle at 88% 28%,#19ddff28,transparent 27%),radial-gradient(circle at 48% 100%,#ff4fa81d,transparent 30%);animation:aurora 14s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;z-index:-4;opacity:.16;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(#000,transparent 85%)}
.light{background:#edf3fc;color:#111827}.light:before{opacity:.35}.light .card,.light .history{background:#ffffffe0}.light .display{background:linear-gradient(145deg,#eef3ff,#e0e9fa)}.light .key{color:#172033}
@keyframes aurora{to{transform:rotate(5deg) scale(1.14);filter:hue-rotate(25deg)}}
.orb{position:fixed;z-index:-2;width:180px;height:180px;border-radius:50%;filter:blur(58px);opacity:.13;pointer-events:none}.a{background:var(--v);left:5%;top:30%;animation:oa 9s ease-in-out infinite}.b{background:var(--c);right:2%;top:66%;animation:ob 11s ease-in-out infinite}@keyframes oa{50%{transform:translate(90px,-80px) scale(1.3)}}@keyframes ob{50%{transform:translate(-100px,70px) scale(.72)}}
.splash{position:fixed;inset:0;z-index:99;background:#050811;display:grid;place-items:center;transition:.7s cubic-bezier(.2,.8,.2,1)}.splash.hide{opacity:0;visibility:hidden;transform:scale(1.04)}.splashInner{text-align:center}.sLogo{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,var(--v),var(--c));font:700 48px "Space Grotesk";box-shadow:0 0 70px #786cff55;animation:sPulse 1.6s infinite}.splashTitle{font:700 25px "Space Grotesk";margin-top:18px}.loader{width:120px;height:3px;border-radius:99px;background:#ffffff12;margin:15px auto;overflow:hidden}.loader i{display:block;width:35%;height:100%;background:linear-gradient(90deg,var(--v),var(--c));animation:load 1s infinite}@keyframes sPulse{50%{transform:scale(1.06);box-shadow:0 0 100px #20dcff40}}@keyframes load{to{transform:translateX(250%)}} 
.wrap{width:min(980px,calc(100% - 18px));margin:auto;padding:16px 0 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.logo{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--v),var(--c));font:700 27px "Space Grotesk";box-shadow:0 10px 35px #786cff45;position:relative;overflow:hidden}.logo:after{content:"";position:absolute;inset:-80%;background:linear-gradient(110deg,transparent 44%,#fff9 50%,transparent 56%);animation:shine 3s infinite}@keyframes shine{0%,25%{transform:translateX(-50%) rotate(25deg)}65%,100%{transform:translateX(70%) rotate(25deg)}}.brand h1{font:700 21px "Space Grotesk";margin:0}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2.2px;margin-top:2px}.actions{display:flex;gap:7px}.icon{width:43px;height:43px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:inherit;backdrop-filter:blur(18px);font-size:18px;transition:.2s}.icon:active{transform:scale(.84)}
.card,.history{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(25px);box-shadow:0 30px 90px #0008;border-radius:29px}.card{padding:14px}.display{min-height:220px;border-radius:23px;background:linear-gradient(145deg,#060a14,#121c32);border:1px solid #ffffff0c;padding:16px 18px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:inset 0 1px #fff08}.display:before{content:"";position:absolute;width:300px;height:190px;right:-100px;bottom:-110px;background:var(--v);filter:blur(75px);opacity:.23;animation:dg 4s ease-in-out infinite alternate}@keyframes dg{to{transform:translate(-60px,-25px);opacity:.4}}.displaybar{display:flex;align-items:center;gap:7px;position:relative;z-index:2}.pill{font-size:10px;font-weight:800;letter-spacing:1px;padding:7px 10px;border-radius:9px;background:#786cff20;color:#bdb8ff}.mem{font-size:10px;color:#697691}.copy{margin-left:auto;border:0;border-radius:10px;padding:8px 11px;background:#ffffff09;color:#aab5cb;font-size:11px}.expr{margin-top:auto;text-align:right;color:#75819a;font-size:17px;min-height:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prev{text-align:right;color:#4f5d76;font-size:11px;min-height:17px}.result{position:relative;z-index:1;text-align:right;font:600 clamp(38px,7vw,62px) "Space Grotesk";letter-spacing:-2.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultPop{animation:rp .4s cubic-bezier(.2,1.5,.3,1)}@keyframes rp{40%{transform:scale(1.07);text-shadow:0 0 35px #786cffbb}100%{transform:scale(1)}}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:11px 0}.ctrl{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--sci);color:#8d99b1;font-size:11px;font-weight:700;transition:.2s}.ctrl.active{background:linear-gradient(135deg,#766bff,#3286ec);color:#fff;border-color:transparent;box-shadow:0 10px 28px #526cff35}.ctrl:active{transform:scale(.92)}.memory{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:-4px 0 10px}.memory .ctrl{height:42px}
.pad{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.key{height:58px;border:1px solid var(--line);border-radius:16px;background:var(--num);color:#f7f9ff;font-weight:700;font-size:17px;position:relative;overflow:hidden;box-shadow:inset 0 1px #fff08,0 6px 16px #0002;transition:transform .13s,filter .18s,box-shadow .18s;isolation:isolate}.key:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff5;left:var(--x,50%);top:var(--y,50%);transform:translate(-50%,-50%) scale(0);pointer-events:none}.key.ripple:after{animation:ripple .5s ease-out}@keyframes ripple{to{transform:translate(-50%,-50%) scale(18);opacity:0}}.key.press{transform:scale(.87);filter:brightness(1.35);box-shadow:0 0 0 4px #786cff14,0 2px 8px #0005}.key:hover{transform:translateY(-2px);filter:brightness(1.12)}.sci{background:var(--sci);color:#aab7cf;font-size:13px}.op{background:var(--op);color:#c9ccff}.fn{background:linear-gradient(145deg,#35213f,#24182f);color:#ff91c1}.eq{grid-row:span 2;background:linear-gradient(135deg,#7b6cff,#248ff0);font-size:26px;box-shadow:0 14px 32px #4f72ff40;animation:eq 3s ease-in-out infinite}@keyframes eq{50%{box-shadow:0 0 0 5px #4f72ff08,0 14px 38px #4f72ff55}}.zero{grid-column:span 2}.hint{display:flex;gap:8px;flex-wrap:wrap;color:#66738e;font-size:10px;margin:12px 3px 0}.hint b{color:#dce1ef}
.history{padding:20px;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:end}.eyebrow{color:var(--c);font-size:9px;font-weight:800;letter-spacing:2.2px}.head h2{font:700 25px "Space Grotesk";margin:5px 0 0}.clear{border:1px solid var(--line);background:#fff07;color:#9da8bd;padding:9px 12px;border-radius:10px;font-size:11px}.list{display:grid;gap:8px;margin-top:15px}.item{padding:13px;border:1px solid var(--line);border-radius:13px;background:#ffffff03;animation:item .4s both;cursor:pointer;position:relative}.item .del{position:absolute;right:10px;top:10px;border:0;background:transparent;color:#71809a;font-size:14px}.ie{font-size:11px;color:#78849d;padding-right:25px}.ir{font-weight:800;margin-top:4px}@keyframes item{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.empty{text-align:center;padding:28px;color:#69758d;font-size:12px}footer{text-align:center;color:#66728b;font-size:10px;margin-top:16px}.toast{position:fixed;z-index:50;left:50%;bottom:25px;transform:translate(-50%,30px);opacity:0;background:#111a2d;color:#fff;border:1px solid #fff12;border-radius:13px;padding:11px 15px;font-size:12px;box-shadow:0 18px 40px #0008;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.wrap{width:min(100% - 12px,540px);padding:10px 0 25px}.card{padding:10px}.display{min-height:190px}.pad{grid-template-columns:repeat(4,1fr);gap:7px}.key{height:56px}.eq{grid-column:4;grid-row:span 2}.zero{grid-column:span 2}.controls{grid-template-columns:repeat(5,1fr)}.history{padding:17px}.head h2{font-size:22px}}@media(max-width:380px){.key{height:51px}.result{font-size:35px}.brand h1{font-size:18px}}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="splashInner"><div class="sLogo">S</div><div class="splashTitle">Sayeed</div><div class="loader"><i></i></div><div style="font-size:9px;letter-spacing:2px;color:#75829c">PRECISION ENGINE</div></div></div>
<div class="orb a"></div><div class="orb b"></div>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">S</div><div><h1>Sayeed</h1><small>PROFESSIONAL CALCULATOR</small></div></div><div class="actions"><button class="icon" id="sound">🔊</button><button class="icon" id="theme">☼</button><button class="icon" id="hist">◷</button></div></header>
<section class="card">
<div class="display"><div class="displaybar"><span class="pill" id="mode">DEG</span><span class="mem" id="mem">M: 0</span><button class="copy" id="copy">Copy</button></div><div class="expr" id="expr">0</div><div class="prev" id="prev">Ready</div><div class="result" id="result">0</div></div>
<div class="controls"><button class="ctrl active" id="deg">DEG</button><button class="ctrl" id="rad">RAD</button><button class="ctrl" id="second">2nd</button><button class="ctrl" id="mc">MC</button><button class="ctrl" id="mr">MR</button></div>
<div class="memory"><button class="ctrl" id="mp">M+</button><button class="ctrl" id="mm">M−</button></div>
<div class="pad" id="pad">
<button class="key fn" data-a="clear">AC</button><button class="key fn" data-a="back">⌫</button><button class="key fn" data-v="%">%</button><button class="key op" data-v="÷">÷</button>
<button class="key sci" data-v="sin(">sin</button><button class="key sci" data-v="cos(">cos</button><button class="key sci" data-v="tan(">tan</button><button class="key sci" data-v="log(">log</button>
<button class="key sci" data-v="ln(">ln</button><button class="key sci" data-v="sqrt(">√</button><button class="key sci" data-v="π">π</button><button class="key sci" data-v="e">e</button>
<button class="key sci" data-v="^2">x²</button><button class="key sci" data-v="^3">x³</button><button class="key sci" data-v="!">x!</button><button class="key op" data-v="×">×</button>
<button class="key sci" data-v="(">(</button><button class="key sci" data-v=")">)</button><button class="key sci" data-v="abs(">abs</button><button class="key sci" data-v="inv(">1/x</button>
<button class="key num" data-v="7">7</button><button class="key num" data-v="8">8</button><button class="key num" data-v="9">9</button><button class="key op" data-v="−">−</button>
<button class="key num" data-v="4">4</button><button class="key num" data-v="5">5</button><button class="key num" data-v="6">6</button><button class="key op" data-v="+">+</button>
<button class="key num" data-v="1">1</button><button class="key num" data-v="2">2</button><button class="key num" data-v="3">3</button><button class="key eq" data-a="eq">=</button>
<button class="key num zero" data-v="0">0</button><button class="key num" data-v=".">.</button>
</div><div class="hint"><b>⌨ Keyboard</b><span>0–9</span><span>+ − × ÷</span><span>Enter</span><span>Backspace</span><span>Esc</span></div>
</section>
<section class="history" id="history"><div class="head"><div><div class="eyebrow">YOUR SPACE</div><h2>Calculation History</h2></div><button class="clear" id="clear">Clear all</button></div><div class="list" id="list"></div></section>
<footer>© <span id="year"></span> Sayeed Calculator • Fast • Private • Offline-ready</footer>
</div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let ex="",mem=+(localStorage.sayeedMem||0),ang="DEG",second=false,snd=localStorage.sayeedSound!=="off",hist=JSON.parse(localStorage.sayeedHistory||"[]");
const funcs={sin:"sin(",cos:"cos(",tan:"tan(",log:"log(",ln:"ln(",sqrt:"sqrt(",abs:"abs(",inv:"inv("};
function beep(f=430){if(!snd)return;try{let A=window.AudioContext||window.webkitAudioContext,c=new A,o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.025,c.currentTime+.006);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.07);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.075)}catch(e){}}
function vib(n=8){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("show");clearTimeout(window.toastT);window.toastT=setTimeout(()=>x.classList.remove("show"),1300)}
function fact(n){if(!Number.isInteger(n)||n<0||n>170)throw Error("Invalid factorial");let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function trig(f,x){x=ang==="DEG"?x*Math.PI/180:x;return second?({sin:Math.asin,cos:Math.acos,tan:Math.atan}[f])(x):({sin:Math.sin,cos:Math.cos,tan:Math.tan}[f])(x)}
function calc(s){let t=s.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-").replaceAll("π","Math.PI").replace(/(\d+(?:\.\d+)?)!/g,"fact($1)").replace(/\^2/g,"**2").replace(/\^3/g,"**3").replace(/sqrt\(/g,"Math.sqrt(").replace(/log\(/g,"Math.log10(").replace(/ln\(/g,"Math.log(").replace(/abs\(/g,"Math.abs(").replace(/inv\(/g,"(1/").replace(/sin\(/g,"trig('sin',").replace(/cos\(/g,"trig('cos',").replace(/tan\(/g,"trig('tan',").replace(/(\d+(?:\.\d+)?)%/g,"($1/100)").replace(/\be\b/g,"Math.E");if(!/^[0-9A-Za-z_+*/().,\s'"*-]+$/.test(t))throw Error("Invalid input");return Function("trig","fact","return ("+t+")")(trig,fact)}
function fmt(n){if(!Number.isFinite(n))throw Error("Math error");return Number(n.toPrecision(13)).toString()}
function update(){q("#expr").textContent=ex||"0";q("#mem").textContent="M: "+fmt(mem);try{q("#result").textContent=fmt(calc(ex));q("#prev").textContent=ex?"Preview":"Ready"}catch(e){q("#result").textContent=ex?"…":"0";q("#prev").textContent=ex?"":"Ready"}}
function q(s){return document.querySelector(s)}
function add(v){ex+=v;update();beep();vib(6)}
function equal(){try{if(!ex)return;let r=fmt(calc(ex));hist.unshift({e:ex,r});hist=hist.slice(0,50);localStorage.sayeedHistory=JSON.stringify(hist);ex=r;$("#prev").textContent="Calculated";$("#result").textContent=r;$("#result").classList.remove("resultPop");void $("#result").offsetWidth;$("#result").classList.add("resultPop");render();beep(780);vib(14)}catch(e){$("#result").textContent="Error";$("#prev").textContent=e.message;beep(160);vib(25);setTimeout(update,900)}}
function render(){let l=$("#list");l.innerHTML=hist.length?hist.map((h,i)=>`<div class="item" data-i="${i}" style="animation-delay:${Math.min(i*35,300)}ms"><button class="del" title="Delete">×</button><div class="ie">${h.e}</div><div class="ir">= ${h.r}</div></div>`).join(""):'<div class="empty">No calculations yet.<br><br>Your recent results will appear here.</div>'}
function press(b,x,y){let r=b.getBoundingClientRect();b.style.setProperty("--x",(x-r.left)+"px");b.style.setProperty("--y",(y-r.top)+"px");b.classList.remove("press","ripple");void b.offsetWidth;b.classList.add("press","ripple");setTimeout(()=>b.classList.remove("press"),150)}
$("#pad").addEventListener("pointerdown",e=>{let b=e.target.closest(".key");if(b){press(b,e.clientX,e.clientY);beep();vib(7)}})
$("#pad").addEventListener("click",e=>{let b=e.target.closest(".key");if(!b)return;let a=b.dataset.a;if(a==="clear"){ex="";update();beep(250)}else if(a==="back"){ex=ex.slice(0,-1);update();beep(300)}else if(a==="eq")equal();else add(b.dataset.v)})
$("#deg").onclick=()=>{ang="DEG";$("#deg").classList.add("active");$("#rad").classList.remove("active");$("#mode").textContent="DEG";update();beep(500)}
$("#rad").onclick=()=>{ang="RAD";$("#rad").classList.add("active");$("#deg").classList.remove("active");$("#mode").textContent="RAD";update();beep(500)}
$("#second").onclick=()=>{second=!second;$("#second").classList.toggle("active",second);toast(second?"2nd functions ON":"2nd functions OFF");beep(620)}
$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#result").textContent);toast("Result copied");beep(650);vib(10)}catch(e){toast("Copy unavailable")}}
$("#mc").onclick=()=>{mem=0;localStorage.sayeedMem=0;update();toast("Memory cleared");beep(300)}
$("#mr").onclick=()=>add(fmt(mem))
$("#mp").onclick=()=>{try{mem+=calc(ex);localStorage.sayeedMem=mem;update();toast("M+ saved");beep(600)}catch(e){toast("Invalid value")}}
$("#mm").onclick=()=>{try{mem-=calc(ex);localStorage.sayeedMem=mem;update();toast("M− saved");beep(600)}catch(e){toast("Invalid value")}}
$("#clear").onclick=()=>{hist=[];localStorage.removeItem("sayeedHistory");render();toast("History cleared");beep(250)}
$("#list").onclick=e=>{let b=e.target.closest(".item");if(!b)return;let i=+b.dataset.i;if(e.target.closest(".del")){hist.splice(i,1);localStorage.sayeedHistory=JSON.stringify(hist);render();toast("Deleted");beep(240);return}ex=hist[i].e;update();toast("Expression restored");beep(520)}
$("#hist").onclick=()=>$("#history").scrollIntoView({behavior:"smooth"})
$("#sound").onclick=()=>{snd=!snd;localStorage.sayeedSound=snd?"on":"off";$("#sound").textContent=snd?"🔊":"🔇";if(snd)beep(650)}
$("#theme").onclick=()=>{document.body.classList.toggle("light");toast("Theme switched");beep(520)}
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;let k=e.key;if(/[0-9.]/.test(k))add(k);else if(k==="+"||k==="-")add(k==="-"?"−":"+");else if(k==="*"){add("×")}else if(k==="/"){e.preventDefault();add("÷")}else if(k==="Enter"||k==="="){e.preventDefault();equal()}else if(k==="Backspace"){e.preventDefault();ex=ex.slice(0,-1);update();beep(320)}else if(k==="Escape"){ex="";update();beep(240)}});
$("#sound").textContent=snd?"🔊":"🔇";$("#year").textContent=new Date().getFullYear();render();update();
window.addEventListener("load",()=>setTimeout(()=>$("#splash").classList.add("hide"),750));
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body></html>
